<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Conny & Isla</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background-overlay"></div>

<div class="login-wrapper">

    <!-- Left -->

    <div class="left-panel">

        <h1>Conny<span>&</span>Isla</h1>

        <p>

            Welcome back.

            Sign in to manage your content,

            videos, gallery and dashboard.

        </p>

    </div>

    <!-- Right -->

    <div class="login-card">

        <h2>Welcome Back</h2>

        <p class="subtitle">

            Login to continue

        </p>

        <form id="loginForm">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button class="login-btn">

                Login

            </button>

        </form>

    </div>

</div>

<script type="module" src="js/login.js"></script>

</body>

</html>
